  - generic [ref=e115]: "# Leo ## Personality * **Relentlessly Ambitious:** He constantly chases the flashy, high-stakes \"blue box\" of success, actively rejecting anything that feels safe, quiet, or predictable. * **Volcanically Expressive:** When faced with rejection or boundaries, his frustration manifests as intense, explosive physical and vocal anger that demands the room's attention. * **Fiercely Autonomous:** He insists on being the center of the room and the ultimate decision-maker, guarding his independence against any perceived control or compromise. * **Contradictory in Affection:** He desperately craves comfort and connection, but physically rejects soothing touch until he is completely drained and the conflict has passed. ## Strengths * **High-Stakes Persuasion:** His ability to command a room, escalate his passion, and refuse to back down makes him a formidable closer in tech sales and a captivating pitchman. * **Unyielding Drive:** His absolute refusal to settle for the \"boring apples\" of a quiet life pushes him to achieve massive, highly visible successes and guard his autonomy. * **Resilient Recovery:** Once the explosive battle is over and his adrenaline fades, he is able to drop his defenses, accept his exhaustion, and finally receive the love and support of those around him. ## Struggles * **Destructive Reaction to Rejection:** Hearing \"no\" triggers a regression into blinding, physical rage—"