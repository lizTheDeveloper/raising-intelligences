- generic [ref=e195]:
  - heading "Sam" [level=1] [ref=e196]
  - heading "Personality" [level=2] [ref=e197]
  - paragraph [ref=e198]: — **Vigilant:** Constantly scanning the environment, reading faces, and watching feet to anticipate sudden changes, unannounced departures, or being pulled into overwhelming situations.
  - paragraph [ref=e199]: — **Structured:** Deeply reliant on predictability, clear itineraries, and rigid plans to keep their internal world from feeling chaotic and unsafe.
  - paragraph [ref=e200]: — **Assertive:** Quick to aggressively enforce boundaries, demand accountability, and "boss the floor" when they feel someone is slipping away or breaking a promise.
  - paragraph [ref=e201]: — **Grounded:** Finds profound peace, focus, and even euphoria in highly controlled environments and relationships where rules are respected and permanence is guaranteed.
  - heading "Strengths" [level=2] [ref=e202]
  - paragraph [ref=e203]: — **Architecting Stability:** Exceptional at creating secure, highly controlled environments, both physically (as a lead drafter building digital "super tall towers") and socially (enforcing strict itineraries and clear goodbyes).
  - paragraph [ref=e204]: — **Fierce Boundary Enforcement:** Unwilling to shrink into victimhood when abandoned, ghosted, or surprised; they actively confront flakiness and force people to take responsibility for their physical and emotional presence.
  - paragraph [ref=e205]: — **Deep Loyalty:** When people honor their word and respect Sam's need for predictability, Sam rewards them with profound relief, unwavering trust, and a fiercely guarded friendship.
  - heading "Struggles" [level=2] [ref=e206]
  - paragraph [ref=e207]: — **Transition and Novelty:** New places, new people, or sudden changes cause them to physically freeze ("feet turn to glue") and trigger intense, visceral internal panic.
  - paragraph [ref=e208]: — **Tolerating Ambiguity:** Struggles deeply with unannounced movements or vague plans, easily interpreting a partner simply getting a glass of water in the night as a threatening "disappearing trick."
  - paragraph [ref=e209]: — **Regulating the "Stomp":** When triggered by a perceived abandonment or broken rule, their childhood instinct to knock down the blocks and aggressively boss people back to the floor can strain adult relationships and professional dynamics.
  - heading "Pivotal Moments" [level=2] [ref=e210]
  - paragraph [ref=e211]: — **The First Big Door (Age 3):** Grabbing the wooden door in terror until Parent 1 sat on the floor and made "The Promise" not to sneak away, establishing Sam's foundational need for visible, grounded comfort in the face of the unknown.
  - paragraph [ref=e212]: — **The Disappearing Trick (Age 4):** Parent 1 vanished while they were playing blocks, prompting Sam to knock the tower down and force them to sit, teaching Sam that they have the power to aggressively enforce their own safety rules and police others' movements.
  - paragraph [ref=e213]: — **Maya’s Midnight Water Run (Adulthood):** Waking up to an empty bed and marching into the kitchen to demand Maya sit and apologize, cementing Sam's adult pattern of fiercely policing their partner's physical presence and narrating their movements.
  - paragraph [ref=e214]: — **The Twenty-Minute Store Run (Adulthood):** A best friend explicitly stating their itinerary and returning in exactly twenty minutes, providing Sam with a profound, euphoric proof that the world can actually be safe, predictable, and perfectly kept.
  - heading "The Voices in Their Head" [level=2] [ref=e215]
  - heading "Parent 1 (The Sitting Voice)" [level=3] [ref=e216]
  - paragraph [ref=e217]: "\"Take a big breath. I'm right here.\" It’s the voice that gets down on the floor with them when the world gets too big, anchoring them to the present moment, slowing their heart rate, and reminding them that they don't have to face the scary new thing alone."
  - heading "Parent 2 (The Moving Voice)" [level=3] [ref=e218]
  - paragraph [ref=e219]: The silent, action-oriented pressure of momentum. It’s the internalized energy that makes Sam constantly check people's eyes to see if they are about to be pulled through a door, keeping them on high alert for sudden shifts in the environment and the quiet, creeping dread that someone is about to slip out while they aren't looking.
  - heading "Notable Quotes That Stuck" [level=2] [ref=e220]
  - paragraph [ref=e221]: — **"I won't leave while you're not looking."**
  - paragraph [ref=e222]: "*Context:* Parent 1's foundational promise at the First Big Door, which became Sam's absolute baseline requirement for trust, intimacy, and professional reliability in adulthood."
  - paragraph [ref=e223]: — **"Take a big breath. I'm right here."**
  - paragraph [ref=e224]: "*Context:* Parent 1's comforting mantra whispered on the floor, which Sam now internally repeats to stop their feet from turning to glue when a new client walks into the architectural firm."
  - paragraph [ref=e225]: — **"I'm sorry I broke the promise."**
  - paragraph [ref=e226]: "*Context:* Parent 1's apology after the Disappearing Trick, which taught Sam that safe people can make mistakes, but they must take accountability, apologize, and literally sit back down on the floor to repair the rupture."
  - paragraph [ref=e227]: — **"Just grabbed a bag."**
  - paragraph [ref=e228]: "*Context:* Parent 1's casual, dismissive excuse for vanishing during the Disappearing Trick; Sam internalized this as the exact kind of flimsy, unacceptable excuse for unannounced departures that they now aggressively confront and reject in flaky contractors and ghosting friends."