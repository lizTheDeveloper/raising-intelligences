    - paragraph [ref=e176]: Sam chooses a small, specialized architectural firm in a quiet, mid-sized city, deliberately avoiding the "big doors and too many new people" of a massive corporate agency. In the studio, Sam is the lead drafter who builds the digital "super tall towers," finding deep, grounding satisfaction in structural permanence and controlled environments. When a new client walks into the office, Sam’s feet still turn to glue, freezing momentarily before the internal Sitting Voice whispers, *Take a big breath. I'm right here.* Professionally, Sam is known for a rigid, almost demanding need for clear itineraries; if a colleague steps out for coffee without announcing it, Sam's tummy gets tight and scary, and they will sharply text, *Where are you and when are you back?* They are the office "boss of the floor," ensuring no one slips out of the project plan without a documented goodbye, fiercely guarding the team's predictability.
    - paragraph [ref=e177]: "In romance, Sam’s childhood need to watch for wiggling toes dictates the rhythm of their intimacy. They date Maya, a restless freelance photographer whose sudden, chaotic movements initially trigger Sam’s deepest fears. When Maya quietly slips out of bed one night to grab a glass of water, Sam wakes to the empty space, and the old panic flares hot and immediate. Sam doesn't just cry; a stomping, righteous anger takes over. They march into the kitchen, demand Maya sit at the island, and require a direct apology for breaking the unspoken rule of announcing departures. Maya learns the boundary quickly: she must always narrate her movements, even if it's just to the bathroom. When adversity hits—like a friend ghosting or a flaky contractor abandoning a site—Sam refuses to shrink into the \"small crier at the door.\" Instead, they aggressively confront the disappearance, forcing the offending party to literally sit down and explain themselves, testing their resolve until they prove they aren't going to slip away again."
    - paragraph [ref=e178]: With their small, fiercely guarded circle of friends, Sam constantly checks faces for the "Moving Voice," scanning eyes to see if someone is about to pull them into an overwhelming social situation or slip out of a commitment. They avoid crowded festivals and surprise parties, preferring quiet nights building intricate, towering board game structures where every piece is accounted for and no one can sneak away. What truly makes Sam come alive is the profound, quiet safety of a perfectly kept promise. When their best friend explicitly says, "I am going to the store, I will be back in exactly twenty minutes," and returns right on the dot, Sam feels a rush of euphoric relief. In these moments, the tight knot in their stomach unravels completely. They are no longer the child desperately grabbing the wood of the First Big Door; they are the architect of their own secure world, standing firmly on the floor they bossed into existence, watching the people they love stay exactly where they said they would.
