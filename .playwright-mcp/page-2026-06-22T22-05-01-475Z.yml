- generic [ref=e203]:
  - heading "Ada" [level=1] [ref=e204]
  - heading "Personality" [level=2] [ref=e205]
  - paragraph [ref=e206]: — **Tactile and Grounded:** She navigates the world through physical touch and weight, finding certainty in the texture of old paper, the pressure of a crushingly tight hug, and the solid concrete of a stairwell.
  - paragraph [ref=e207]: — **Deeply Observant and Sensitive:** Her nervous system processes the world at a high volume, making her acutely aware of sensory details like the "funny smell" of unfamiliar doorways or the blurring, swimming-pool glare of fluorescent lights.
  - paragraph [ref=e208]: — **Fiercely Loyal but Guarded:** She cultivates a small, carefully curated circle of people who understand that her need for silence is a request for presence, not a puzzle to be solved.
  - heading "Strengths" [level=2] [ref=e209]
  - paragraph [ref=e210]: — **Proactive Self-Advocacy:** By age twenty-five, she has learned to articulate her sensory needs before a panic attack peaks, clearly stating "I need a heavy hug" rather than waiting to melt down into tears.
  - paragraph [ref=e211]: — **Deep Focus and Archival Instinct:** She thrives in the climate-controlled silence of special collections, using the tactile reality of historical artifacts to anchor herself when the modern world feels too vast and loud.
  - paragraph [ref=e212]: — **Emotional Authenticity:** She rejects false cheerfulness in times of crisis, knowing exactly what she needs to feel solid and refusing to be placated by coping mechanisms that don't work.
  - heading "Struggles" [level=2] [ref=e213]
  - paragraph [ref=e214]: — **Sensory Overload:** Bright, loud, or crowded environments (like grocery store aisles or a crowded subway) can instantly flood her brain with deafening static, collapsing her perception of time until "later" disappears into a terrifying "now."
  - paragraph [ref=e215]: — **Intolerance for Toxic Positivity:** When she is spiraling, well-meaning attempts to cheer her up or offer cheerful distractions feel profoundly invalidating and only increase her frustration and fury.
  - paragraph [ref=e216]: — **Fear of Disappearance:** Because "later" just means "gone" to her younger self, she sometimes struggles with the permanence of absence, needing immediate, physical proof that her loved ones are right there in the room.
  - heading "Pivotal Moments" [level=2] [ref=e217]
  - paragraph [ref=e218]: — **The Daycare Doorway (Age 3):** Clinging to the jingly keys and hiding behind Parent 1 taught her that while the outside world is terrifyingly vast, she can carry a piece of "home" in her pocket to survive it.
  - paragraph [ref=e219]: — **The Grocery Store Meltdown (Age 4):** When losing her blue blankie caused her to shatter, Parent 1 abandoning the distraction games to deliver a heavy, silent physical squeeze taught her how a broken self can be physically pressed back together.
  - paragraph [ref=e220]: — **The Subway Panic Attack (Age 22):** Retreating to the heavy concrete of the stairwell and pressing against the wall proved to her adult self that she could generate her own grounding pressure without needing a parent to carry her out of the loud place.
  - paragraph [ref=e221]: — **The Breakthrough with Elias (Age 25):** When her partner stopped offering frantic distractions and instead pinned her chest against his to silently count to five, it finally healed her childhood wound of feeling unheard during a crisis.
  - heading "The Voices in Their Head" [level=2] [ref=e222]
  - heading "Parent 1" [level=3] [ref=e223]
  - paragraph [ref=e224]: The sound of a soft, slow breath that cuts through her panic, which eventually stops talking entirely to become a heavy, warm blanket that holds her together.
  - heading "Parent 2" [level=3] [ref=e225]
  - paragraph [ref=e226]: A gentle, well-meaning whisper urging her to step forward into the scary, too-big world, which slowly fades into the background of her psyche as she learns to trust her own boundaries.
  - heading "Notable Quotes That Stuck" [level=2] [ref=e227]
  - paragraph [ref=e228]: — **"It's okay to feel scared, it's a big step."**
  - paragraph [ref=e229]: "*Spoken softly by Parent 1 at the daycare doorway, this validated her fear of the \"funny smelling\" outside world before they tried to hand her the jingly keys to be brave.*"
  - paragraph [ref=e230]: — **"Find the green things."**
  - paragraph [ref=e231]: "*A cheerful distraction game offered by Parent 1 during her Age 4 grocery store meltdown that inadvertently taught her to deeply resent being deflected when her panic demands physical rescue.*"
  - paragraph [ref=e232]: — **"I've got you, you're safe."**
  - paragraph [ref=e233]: "*Whispered by Parent 1 against her chest after they stopped playing games and just held her in a crushing, five-second squeeze, becoming the ultimate anchor she still seeks from her romantic partners today.*"