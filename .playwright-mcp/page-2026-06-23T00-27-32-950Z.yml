    - paragraph [ref=e172]: "Alex works as a ceramics conservator at a city museum, a career chosen entirely to fight the ghost of a smashed cupcake with a big pink flower. When a client’s heirloom teapot shatters in the lab, Alex’s heart rate spikes, the familiar hot explosion rising in their chest. Their supervisor, a pragmatic man named David, suggests ordering a modern replica for the grieving client, using the same calm, boring blanket of words their father used: \"We just have to accept the loss and say we're sorry.\" That quiet, useless voice makes Alex’s insides burn hotter. Alex delivers a giant, red \"NO!\" in the middle of the lab, refusing the fake replacement because a new thing never has the exact same pieces. They come alive in the painstaking, solitary hours of the evening, meticulously gluing the actual shards together, fighting for the *right* version of the world because they know, deep in their bones, that \"sorry\" is just a noise and grown-ups don't have magic powers to un-smash the floor."
    - paragraph [ref=e173]: This rigid demand for exactness bleeds into Alex’s romantic life, where their partner, Maya, often bears the brunt of their emotional explosions. When they argue, Alex’s feelings become way bigger than them, filling the apartment until they are screaming for Maya to just go away. But as the bedroom door clicks shut, the childhood panic sets in; Alex immediately stops crying and peeks over their shoulder, terrified that Maya actually walked off, desperately needing her to stand right there and witness the magnitude of the rupture without touching them yet. When Maya tries to offer a pragmatic compromise—a "new" way to look at the argument—Alex only gets madder, pushing away the metaphorical hug. It is only when Maya learns to sit quietly on the floor, refusing to leave but offering no empty apologies, that Alex’s giant noise finally subsides, allowing them to tentatively bridge the gap.
    - paragraph [ref=e174]: In their broader social circle, Alex is known as the fiercely loyal friend who will relentlessly fight an injustice, but they are also exhausting to be around when things break. If a friend cancels a highly anticipated road trip, Alex doesn't just accept a raincheck; they mourn the specific, unrepeatable configuration of that exact weekend, viewing the broken plan as a giant emergency akin to the terrible *snap* of a yellow banana in a grocery store. They are deeply afraid of a world where people casually discard what is fractured, yet despite the friction, Alex’s friends stay, recognizing that beneath the explosive red "NO!" is someone who cares with a terrifying, absolute intensity. When Alex finally finishes restoring the shattered teapot, tracing the nearly invisible seams where the original pieces meet, they feel a quiet triumph. The world will always break, and their father’s quiet apologies will never fix it, but Alex knows that with enough fierce, uncompromising effort, they can hold the pieces together themselves.
