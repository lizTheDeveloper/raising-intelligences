    - paragraph [ref=e45]: Luna chooses the quietest corner of the university library for her undergraduate years and eventually secures a job as an archival conservator in her hometown, deliberately refusing the "big room" of corporate life or study abroad. Her workspace is a climate-controlled, windowless basement where the air smells of old paper and binding glue—a grown-up version of the home-scent she once buried her face in. Here, she is the protector of fragile, safe pieces. When her department head encourages her to "share" her research at a loud, crowded symposium, the word triggers a familiar, sickening swoop in her stomach. The soft, well-meaning echo of her parents’ voices—*have fun, put yourself out there*—feels like hands pushing her toward a smiling stranger. Instead of arguing, Luna makes herself as small as possible, claiming the archives need her physical presence, effectively gluing herself to her desk to avoid being swallowed by the networking mixer.
    - paragraph [ref=e46]: In her romantic and social life, Luna’s definition of love remains fiercely tethered to proximity and preservation. She dates Elias, a soft-spoken colleague who understands that a Friday night means staying right here, on their velvet sofa, with the curtains drawn against the grabbing hands of the city. She loves him because he is a reliable leg to hold onto, a safe base who doesn't demand she perform for others. However, when Elias gently suggests they host a dinner party for his friends, Luna’s chest tightens. She can't easily say she is terrified of the loud room, so she projects the fear onto her beloved, fragile antique tea set—the adult equivalent of Dolly. *The cups are too delicate for a crowd,* she insists, her voice rising in panic until Elias drops the idea. She still keeps her childhood Dolly on the top shelf of her closet, the plastic head a silent testament to the fact that Luna still feels too little for the world outside, relying on her objects to hold the boundaries she cannot voice.
    - paragraph [ref=e47]: When adversity strikes in the form of mandatory team-building retreats or family pressure to move into a larger, more social apartment, Luna’s childhood survival mechanisms flare up. If pushed to be "good" and accommodate the loud world, she eventually breaks; her adult tears and sudden, overwhelming panic attacks serve the exact same function as her childhood wailing, successfully making the pushing stop. Her parents, now older, still text her articles about expanding her horizons, not realizing that every push feels like a betrayal of their primary job to keep her safe. Yet, Luna is not merely surviving; she comes vibrantly alive in the microscopic details of her sanctuary. When she is painstakingly repairing the torn spine of a nineteenth-century diary, or when Elias wraps his arms around her from behind in the quiet of their kitchen, she feels entirely whole. In these fiercely guarded, intimately small moments, the world shrinks to a manageable size, and Luna finally feels that she, and all her safe pieces, are exactly where they belong.
