- generic [ref=e51]:
  - heading "Luna" [level=1] [ref=e52]
  - heading "Personality" [level=2] [ref=e53]
  - paragraph [ref=e54]: — **Fiercely Protective:** She guards her physical space, her loved ones, and her fragile objects with the intense, unwavering dedication of someone defending a sacred sanctuary.
  - paragraph [ref=e55]: — **Deeply Introverted:** She recharges and feels most vibrantly alive in quiet, enclosed, and meticulously controlled environments, far away from the "loud room" of the outside world.
  - paragraph [ref=e56]: — **Avoidant yet Reactive:** She will quietly shrink herself to avoid conflict, but when pushed past her limits, she uses overwhelming emotional distress and panic to forcefully enforce her boundaries.
  - paragraph [ref=e57]: — **Highly Observant:** She finds profound meaning, comfort, and purpose in the microscopic, intricate details of her work and her intimate relationships.
  - heading "Strengths" [level=2] [ref=e58]
  - paragraph [ref=e59]: — **Exceptional Focus and Care:** Her innate need for a controlled, quiet environment makes her a brilliant archival conservator who can painstakingly repair and preserve fragile, neglected things that others overlook.
  - paragraph [ref=e60]: — **Fierce Loyalty in Intimacy:** Once someone is allowed into her "safe base," like her partner Elias, she offers a deeply grounded, present, and devoted partnership that doesn't require performative socializing.
  - paragraph [ref=e61]: — **Strong Self-Preservation:** She knows exactly what environments are toxic to her mental health and has successfully architected a life, a career, and a home that honor her fundamental need for safety.
  - heading "Struggles" [level=2] [ref=e62]
  - paragraph [ref=e63]: — **Inability to Voice Direct Boundaries:** Instead of simply saying "I am scared" or "I don't want to," she projects her fears onto inanimate objects (like her childhood Dolly or her antique tea set) or relies on panic attacks to make demands stop.
  - paragraph [ref=e64]: — **Paralyzing Fear of Exposure:** The expectation to "share" herself, network, or host others triggers a visceral, sickening panic that severely limits her professional advancement and social flexibility.
  - paragraph [ref=e65]: — **Over-reliance on Proximity for Security:** Her definition of safety is so tightly tethered to physical closeness and familiar spaces that any push toward independence, travel, or expansion feels like a profound betrayal by those who are supposed to protect her.
  - heading "Pivotal Moments" [level=2] [ref=e66]
  - paragraph [ref=e67]: — **The First Day of Preschool (Age 3):** Being pushed toward a smiling teacher in a bright, giant room taught her that the outside world is a swallowing void, and that crying louder was the only way to make the pushing stop.
  - paragraph [ref=e68]: — **Choosing the Windowless Archives (Adulthood):** Deliberately selecting a climate-controlled basement job cemented her lifelong strategy of retreating from the "big room" to become the protector of fragile, safe pieces.
  - paragraph [ref=e69]: — **The Tea Set Panic (Adulthood):** When Elias suggested a dinner party, her panicked insistence that the antique cups were "too delicate" perfectly crystallized her adult coping mechanism of projecting her own fragility onto objects to avoid the loud world.
  - paragraph [ref=e70]: — **Repairing the Nineteenth-Century Diary (Adulthood):** Painstakingly fixing a torn spine in the quiet of her sanctuary proved that her retreat from the world wasn't just about hiding, but a way to find profound, vibrant purpose in the small things.
  - heading "The Voices in Their Head" [level=2] [ref=e71]
  - heading "Her Mother" [level=3] [ref=e72]
  - paragraph [ref=e73]: "*“We love you, share, have fun.”*"
  - paragraph [ref=e74]: It sounds soft and encouraging on the surface, but in Luna's head, it translates to the terrifying sensation of gentle hands prying her fingers off a safe pant leg and pushing her toward a smiling stranger.
  - heading "Her Father" [level=3] [ref=e75]
  - paragraph [ref=e76]: "*“Put yourself out there and expand your horizons.”*"
  - paragraph [ref=e77]: It echoes as a relentless, well-meaning pressure to perform for the loud world, carrying the heavy, unspoken implication that her desire to stay small and safe is a problem to be fixed rather than a survival mechanism to be respected.
  - heading "Notable Quotes That Stuck" [level=2] [ref=e78]
  - paragraph [ref=e79]: — **"We love you, share, have fun."** — Spoken on her first day of preschool while trying to detach her from their leg; it permanently linked the concept of parental love with the terrifying loss of her safety to strangers.
  - paragraph [ref=e80]: — **"Share."** — A single, recurring trigger word that Luna learned to fear at age three; to her, it never meant making friends, only losing her safe things to people she didn't know.
  - paragraph [ref=e81]: — **"Have fun, put yourself out there."** — The echoing parental chorus she hears when her department head encourages her to present at a symposium, making her feel physically pushed toward the "grabbing hands" of the crowd.
  - paragraph [ref=e82]: — **"Expanding your horizons."** — The recurring theme of the articles her parents text her in adulthood, which she interprets as a continued, misguided attempt to push her out of her sanctuary and into the swallowing "big room."