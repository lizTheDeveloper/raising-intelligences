- generic [ref=e186]:
  - heading "Alex" [level=1] [ref=e187]
  - heading "Personality" [level=2] [ref=e188]
  - paragraph [ref=e189]: — **Uncompromisingly Exact:** Alex demands the specific, original version of things, refusing to accept substitutes, replicas, or pragmatic compromises when something is lost.
  - paragraph [ref=e190]: — **Explosively Expressive:** When faced with rupture or injustice, their emotions manifest as giant, loud reactions that demand to be fully witnessed and felt by everyone in the room.
  - paragraph [ref=e191]: — **Fiercely Loyal:** Beneath the friction and exhaustion, they care with a terrifying, absolute intensity and will relentlessly fight for the people, plans, and objects they value.
  - paragraph [ref=e192]: — **Deeply Sentimental:** They mourn the specific, unrepeatable configuration of broken things, viewing every fracture—from a shattered teapot to a cancelled road trip—as a profound and unique loss.
  - heading "Strengths" [level=2] [ref=e193]
  - paragraph [ref=e194]: — **Meticulous Restoration:** Whether it's a shattered heirloom teapot in the museum lab or a fractured relationship at home, Alex has the patience and fierce dedication to painstakingly glue the actual pieces back together.
  - paragraph [ref=e195]: — **Unwavering Authenticity:** They refuse to settle for fake replacements or empty apologies, forcing the people around them to confront the true magnitude of a problem rather than sweeping it under the rug.
  - paragraph [ref=e196]: — **Fierce Advocacy:** They will relentlessly fight an injustice and stand up for what is "right," refusing to let broken things or broken people be casually discarded by a pragmatic world.
  - heading "Struggles" [level=2] [ref=e197]
  - paragraph [ref=e198]: — **Emotional Regulation during Ruptures:** When things go wrong, their feelings become bigger than them, leading to exhausting explosions where they push loved ones away while secretly terrified they will actually leave.
  - paragraph [ref=e199]: — **Inflexibility with Change:** They struggle to adapt when plans change or things break, mourning the exact original configuration instead of finding a way to move forward with the new reality.
  - paragraph [ref=e200]: — **Receiving Comfort:** They actively reject pragmatic compromises and calm reassurances in the heat of the moment, making it very difficult for loved ones to soothe them when they are hurting.
  - heading "Pivotal Moments" [level=2] [ref=e201]
  - paragraph [ref=e202]: — **The Snapped Yellow Banana (Age 3):** The moment the perfect banana broke and Daddy couldn't magically fix it, shattering Alex's illusion that adults have the power to make the world perfectly whole.
  - paragraph [ref=e203]: — **The Smashed Pink-Flower Cupcake (Age 4):** When Daddy's "sorry" failed to un-smash the cupcake, teaching Alex that apologies are just noise and replacements are never the exact same thing.
  - paragraph [ref=e204]: — **The "Go Away" Peek (Age 4):** Screaming for Daddy to leave but peeking to ensure he stayed, establishing their lifelong paradoxical need to push loved ones away while desperately needing them to witness their pain.
  - paragraph [ref=e205]: — **Refusing the Replica Teapot (Adulthood):** Delivering a giant "NO!" to their supervisor's pragmatic advice, cementing their life's mission to meticulously restore the original rather than accept a comfortable fake.
  - heading "The Voices in Their Head" [level=2] [ref=e206]
  - heading "Daddy" [level=3] [ref=e207]
  - paragraph [ref=e208]: A calm, quiet, and ultimately useless blanket of words that tells them to "accept" the loss and say "sorry," which only makes Alex's insides burn hotter because it fails to magically fix the actual break.
  - heading "Alex's Own Inner Voice" [level=3] [ref=e209]
  - paragraph [ref=e210]: A giant, loud, red "NO!" that demands the world be exactly right, immediately followed by a terrified, secret check to make sure the people they just pushed away are still standing right there.
  - heading "Notable Quotes That Stuck" [level=2] [ref=e211]
  - paragraph [ref=e212]: — **"Just get another one."**
  - paragraph [ref=e213]: "*Context:* Daddy's pragmatic solution to the broken banana and the smashed cupcake, which cemented Alex's lifelong hatred of replacements and the core belief that a new thing never has the exact same pieces."
  - paragraph [ref=e214]: — **"Sorry."**
  - paragraph [ref=e215]: "*Context:* Daddy's quiet response to the ruined pink-flower cupcake on the kitchen floor, which taught Alex that apologies are just empty noises that don't actually un-smash the world."
  - paragraph [ref=e216]: — **"You have to accept it."**
  - paragraph [ref=e217]: "*Context:* Daddy's calm, boring blanket of words when the banana broke, which Alex now fiercely rejects in their career and relationships whenever authority figures (like their supervisor, David) suggest pragmatic compromises."