  - generic [ref=e158]:
    - paragraph [ref=e159]: "At twenty-two, Alex navigates the sprawling, rain-slicked streets of the city as an independent estate liquidator and vintage scout. It is the perfect adult translation of the play corner: they spend their days hunting through the dusty, forgotten rooms of abandoned homes, searching for the adult equivalent of the sparkly car hiding under the red chair. When they uncover a bright, shiny piece of green acrylic furniture or a rare first edition left behind by careless heirs, that familiar, fast, buzzy feeling floods their veins. They are a finder of secret treasures, and in their mind, the rule of finding still reigns supreme. But the professional world of contracts and property law constantly imposes that invisible, heavy rule of \"belonging.\" When a client demands Alex hand over a discovered artifact they intended to secretly flip on the side, a heavy rock drops right in Alex's tummy. They justify their hoarding with big, loud reasons, entirely consumed by their wants, convinced that because they saw it and wanted it first, the universe meant for it to be theirs."
    - paragraph [ref=e160]: When adversity hits—like a business partner contesting a profit split or a client threatening legal action over a withheld item—the childhood patterns flare up violently. The hot, tight sensation grips Alex's chest, and their internal siren screams so loudly it drowns out all logic and negotiation. In professional disputes, Alex doesn't just argue; they escalate until their legs literally turn to jelly. Overwhelmed by the terrifying fear that they might pop if they don't release the pressure, they sometimes find themselves sinking to the office floor, pressing their cheek against the cold tiles just as they did when their legs stopped working years ago. They kick against the boundaries of others, letting the hot air out in explosive, tear-filled tirades. Yet, amidst the chaos, the internalized echo of Parent 1’s voice wraps around them like a soft, suffocating blanket, whispering that they need to calm down and give it back. Alex resents this heavy blanket, feeling squished by the very empathy and restraint that tries to regulate their giant feelings, but they ultimately rely on it to survive the aftermath of their own storms.
    - paragraph [ref=e161]: In their romantic life, Alex unconsciously seeks out the steady, unyielding presence of Parent 1. Their current partner, a pragmatic architect named Julian, acts as the tall wall that stops Alex from spiraling out of control. When Alex hides things—sometimes literally stashing expensive gifts or contested items deep into their coat pockets to chase that secret, buzzy thrill—Julian doesn't yell. Instead, he gently reaches into the pocket, pulls the secret treasure into the light, and simply waits for Alex’s siren to run out of breath. It frustrates Alex to no end that Julian enforces the rules of belonging, yet they are deeply anchored by his refusal to abandon them when they are kicking at the walls. With friends, Alex is the vibrant, demanding center of their own world, fiercely loyal but prone to treating people's time and affection as things they have "found" and therefore own. They are terrified of being told they are too much, yet they cannot stop wanting, constantly testing their relationships to see who will stay sitting on the cold floor next to them when their legs finally give out.
