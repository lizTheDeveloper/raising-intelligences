    - paragraph [ref=e183]: Ada chooses the subterranean quiet of the university’s special collections archive, a world of climate-controlled silence far removed from the bright, blurry lights of the store aisles that still haunt her nightmares. At twenty-two, she surrounds herself with the tactile certainty of old paper and leather, grounding herself in the physical realm when the modern world feels too vast and loud. She keeps a small, weighted lap pad in her satchel—a grown-up echo of her blue blankie—because when her hands are empty, the scary feelings still threaten to swallow her whole. She is most alive in these hushed, dusty rooms where time doesn't rush, but when a sudden fire alarm or an unexpected crowd forces her into the glaring outside, her brain instantly floods with deafening static. In those moments, she doesn't look for green things to distract herself; she retreats to the heavy, solid concrete of the stairwell, pressing her body against the wall until the deep physical pressure makes her feel real again.
    - paragraph [ref=e184]: Her romantic relationships often fracture over this exact dynamic of crisis management. When her anxiety spikes, her partner, Elias, instinctively tries to play games or offer cheerful distractions to pull her out of the spiral, his voice bright and frantic. It only makes her madder, mirroring the childhood fury when Parent 1 tried to deflect her panic; she feels profoundly unheard, trapped in a terrifying "now" where "later" simply doesn't exist. She doesn't want to play; she wants to be rescued. The breakthrough arrives on a rainy Tuesday when she is shaking after a sensory-overload panic attack on the subway. Instead of offering a coping mechanism, Elias simply wraps his arms tightly around her, pulling her chest flush against his. He stops talking, his own chest vibrating as he whispers, "I've got you, you're safe," holding her in a heavy, warm squeeze and silently counting to five. In that crushing embrace, smelling the familiar scent of his damp wool sweater—which reminds her so sharply of Parent 1’s neck—Ada finally stops breaking apart.
    - paragraph [ref=e185]: By the time she is twenty-five, Ada has learned to translate her childhood needs into adult autonomy, curating a small, fiercely loyal circle of friends and colleagues who understand that her silence is not an invitation to fix her, but a request for presence. She learns to vocalize her boundaries before the bright lights blur her vision, saying, "I need a heavy hug," rather than waiting to dissolve into swimming-pool tears on the linoleum. The gentle, well-meaning echoes of Parent 2 fade into the background of her psyche as she fully embraces the grounding power of Parent 1’s silent rescue, applying it to her own life. She realizes that while she still desperately needs the physical weight of a loved one to feel solid, she no longer needs to be carried out of the loud place; she just needs to know that when she breaks, there are hands strong enough to press her back together.
