    - paragraph [ref=e100]: Leo chooses the high-octane world of tech sales, a realm where the "blue box"—the massive commission, the flashy lifestyle, the undeniable proof of his worth—is always just out of reach but undeniably his. He thrives on being the loud, center-of-the-room closer, actively rejecting the "boring apples" of a stable, predictable corporate track. When a client or manager tells him "no," the familiar heat starts in his gut and shoots down his limbs. He doesn't drop to the sticky linoleum anymore, but he kicks the tires of his car until his shins bruise and screams in his empty apartment until his throat is raw. He is terrified of settling for a quiet, invisible life, coming alive only when the whole world stops to look at him and hand over the prize he believes he is owed.
    - paragraph [ref=e101]: In his romantic and professional relationships, the ghosts of his childhood grocery store aisles dictate his every move. He subconsciously seeks out partners and managers who act like his mother—soft but immovable walls who try to enforce boundaries and offer sensible compromises. When his girlfriend tries to hold him or speak softly while he is mid-rant about a failed account, his body goes stiff as a board; her soothing touch only fuels his fury, and he can only accept her affection later, when he is utterly exhausted and the fight has drained out of him. Conversely, he surrounds himself with "Grandma Diane" friends—loud, sharp-tongued hype men who enable his worst impulses, urging him to "just buy the damn thing" when he is about to max out a credit card on a sports car or quit a job in a blaze of glory just to silence the noise in his head.
    - paragraph [ref=e102]: "When the cautious, boundary-setting voices of his mother-figures and the reckless, enabling shouts of his grandmother-figures collide in his life, Leo’s head still gets hot, and he escalates to make them all hear him. During a major startup pitch at twenty-three, when his conservative co-founder urges caution while his investors demand aggressive expansion, the overlapping demands trigger his oldest survival mechanism: he blows up the meeting, screaming his vision until the room falls into a stunned, silent reverence. He is still the big loud boy who decides what the team consumes, fiercely guarding his autonomy. Yet, in the quiet aftermath, when the adrenaline fades and the board finally yields to his demands, he slumps into his chair, silently waiting for someone to offer the embrace he cannot bear to accept while the battle rages."
