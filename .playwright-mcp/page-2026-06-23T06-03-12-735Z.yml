- generic [ref=e116]:
  - heading "Leo" [level=1] [ref=e117]
  - heading "Personality" [level=2] [ref=e118]
  - paragraph [ref=e119]: — **Relentlessly Ambitious:** He constantly chases the flashy, high-stakes "blue box" of success, actively rejecting anything that feels safe, quiet, or predictable.
  - paragraph [ref=e120]: — **Volcanically Expressive:** When faced with rejection or boundaries, his frustration manifests as intense, explosive physical and vocal anger that demands the room's attention.
  - paragraph [ref=e121]: — **Fiercely Autonomous:** He insists on being the center of the room and the ultimate decision-maker, guarding his independence against any perceived control or compromise.
  - paragraph [ref=e122]: — **Contradictory in Affection:** He desperately craves comfort and connection, but physically rejects soothing touch until he is completely drained and the conflict has passed.
  - heading "Strengths" [level=2] [ref=e123]
  - paragraph [ref=e124]: — **High-Stakes Persuasion:** His ability to command a room, escalate his passion, and refuse to back down makes him a formidable closer in tech sales and a captivating pitchman.
  - paragraph [ref=e125]: — **Unyielding Drive:** His absolute refusal to settle for the "boring apples" of a quiet life pushes him to achieve massive, highly visible successes and guard his autonomy.
  - paragraph [ref=e126]: — **Resilient Recovery:** Once the explosive battle is over and his adrenaline fades, he is able to drop his defenses, accept his exhaustion, and finally receive the love and support of those around him.
  - heading "Struggles" [level=2] [ref=e127]
  - paragraph [ref=e128]: — **Destructive Reaction to Rejection:** Hearing "no" triggers a regression into blinding, physical rage—like kicking cars until his shins bruise or screaming in empty rooms—that damages his well-being.
  - paragraph [ref=e129]: — **Self-Sabotaging Enablers:** He subconsciously surrounds himself with loud "hype men" who encourage his worst financial and professional impulses just to silence the noise in his head.
  - paragraph [ref=e130]: — **Inability to Accept Mid-Conflict Comfort:** His instinct to go "stiff as a board" when partners try to soothe him during an argument creates deep emotional distance and frustrates his loved ones.
  - heading "Pivotal Moments" [level=2] [ref=e131]
  - paragraph [ref=e132]: — **The Grocery Store Tantrum (Age 3):** Dropping to the sticky linoleum over a blue box taught him that explosive anger forces the world to stop and pay attention to him.
  - paragraph [ref=e133]: — **The Rejected Hug (Age 3):** Going stiff as a board when his mother tried to hold him mid-scream cemented his lifelong pattern of physically rejecting comfort while in the throes of anger.
  - paragraph [ref=e134]: — **The Startup Pitch Blowup (Age 23):** Screaming his vision until the board fell into stunned silence proved that his childhood escalation tactics could successfully conquer the adult business world.
  - paragraph [ref=e135]: — **The Post-Battle Slump (Adulthood):** Slumping into his chair after a major victory to silently wait for an embrace highlighted his enduring, unspoken need for connection once the adrenaline fades.
  - heading "The Voices in Their Head" [level=2] [ref=e136]
  - heading "Your Mother" [level=3] [ref=e137]
  - paragraph [ref=e138]: Her voice is a soft but immovable wall that enforces boundaries and offers sensible compromises, echoing in his head whenever he is tempted to self-destruct. *"We don't need the flashy prize right now; let's just do what we came here to do and go home."*
  - heading "Your Grandmother Diane" [level=3] [ref=e139]
  - paragraph [ref=e140]: Her voice is loud, sharp, and deeply enabling, urging him to bypass boundaries and satisfy his immediate impulses to make the internal noise stop. *"Just buy the damn thing, take the risk, and give them what they want so we can move on!"*
  - heading "Notable Quotes That Stuck" [level=2] [ref=e141]
  - paragraph [ref=e142]: — **"We are here for dinner."**
  - paragraph [ref=e143]: His mother's soft but firm boundary in the grocery store, which became the internal voice of boring, predictable obligations he spends his adult life running from.
  - paragraph [ref=e144]: — **"Let's pick apples."**
  - paragraph [ref=e145]: His mother's attempt to offer a sensible, healthy compromise, which Leo permanently coded as the "boring" path of settling for a quiet, invisible life.
  - paragraph [ref=e146]: — **"Just buy the damn things!"**
  - paragraph [ref=e147]: His grandmother's loud, sharp intervention to stop his crying, which evolved into the voice of his enabler friends urging him to max out credit cards and quit jobs in a blaze of glory.
  - paragraph [ref=e148]: — **"No."**
  - paragraph [ref=e149]: The simple, immovable refusal from his mother that acts as his ultimate trigger, instantly sparking the familiar heat in his gut and shooting down his limbs whenever a client or partner denies him.