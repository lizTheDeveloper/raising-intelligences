<!DOCTYPE html>
<html><head>
<link rel="stylesheet" href="../../../styles.css">
</head><body>
<div class="app" style="height: 100vh;">
  <div class="lobby">
    <h1 style="font-weight:300; font-size:30px; letter-spacing:3px; line-height:1.2;">raising nova</h1>
    <p class="dim" style="font-size:13px;">you are the <strong>mother</strong></p>
    <div class="lobby-players">
      <div class="lobby-player">
        <span class="lobby-player-name">Liz</span>
        <span class="lobby-player-status dim">ready</span>
      </div>
      <div class="lobby-player">
        <span class="lobby-player-name">Jordan</span>
        <span class="lobby-player-status dim">waiting</span>
      </div>
    </div>
    <div class="lobby-invite">
      <p class="dim" style="font-size:11px; letter-spacing:1px;">invite link</p>
      <button class="btn" style="font-size:11px; padding:6px 16px;">copy link</button>
    </div>
    <button class="btn" disabled>waiting for partner</button>
  </div>
</div>
</body></html>
